<svg width="1200" height="300" viewBox="0 0 1200 300"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="300">
      <stop offset="0%" stop-color="#071510"/>
      <stop offset="100%" stop-color="#126B3A"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="#080D0B"/>
  <rect width="1200" height="190" fill="url(#background)"/>

  <!-- Decorative circuit lines -->
  <g stroke="#00E676" stroke-width="2" opacity="0.6">
    <path d="M0 35 H110 L155 80 H245"/>
    <path d="M1200 230 H1080 L1035 185 H955"/>
  </g>

  <g fill="#00E676">
    <circle cx="245" cy="80" r="5"/>
    <circle cx="955" cy="185" r="5"/>
  </g>

  <!-- Main title -->
  <text x="600" y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="58"
        font-weight="bold"
        fill="#FFFFFF">
    FULL-STACK
    <tspan fill="url(#green)"> DEVELOPER</tspan>
  </text>

  <!-- Technologies -->
  <text x="600" y="160"
        text-anchor="middle"
        font-family="monospace"
        font-size="27"
        font-weight="bold"
        fill="#39FF14">
    React / Next.js / TypeScript / Node.js / NestJS
  </text>

  <!-- Bottom wave -->
  <path d="M0 215 Q300 145 600 230 T1200 210 V300 H0 Z"
        fill="#06120D"/>

  <path d="M0 215 Q300 145 600 230 T1200 210"
        stroke="url(#green)"
        stroke-width="4"
        filter="url(#glow)"/>

  <!-- Bottom subtitle -->
  <text x="600" y="270"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="20"
        letter-spacing="4"
        fill="#FFFFFF">
    WEB · FULL-STACK · MOBILE · SAAS
  </text>

</svg>
